<!DOCTYPE html>
<html>
    <head>
        <title>Calculator</title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" href="/images/calculator.webp" type="image/webp">
        <script src="script.js" defer></script>
    </head>
    <body>
        <header>
            <h1>Simple Calculator</h1>
        </header>
        <hr>
        <nav>
            <a href="/myproject">Home</a>
            <a href="/index.html">Exit</a>
        </nav>
        <hr>
        <section>
            <p>Welcome to Calculator this is in order from first to second and the operations are below click them to see the result</p>
            <p>Note that this calculator will be changed into a more cool stage in the future</p>
        </section>
        <section>
            <input type="number" placeholder="First Number" id="first">
            <br><input type="number" placeholder="Second Number" id="second">
            <br><button id="addition">Add</button>
            <button id="minus">Subtract</button>
            <br><button id="times">Multiply</button>
            <button id="divide">Divide</button>
            <p id="result"></p>
        </section>
    </body>
</html>
